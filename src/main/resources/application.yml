spring:
  application:
    name: hospitalmithra-platform
  profiles:
    default: local

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false

info:
  app:
    name: HospitalMithra Platform
    description: Healthcare platform foundation
